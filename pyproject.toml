[project]
name = "integri-audit-tool"
version = "0.1.0"
description = "Read-only Postgres database & search audit CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.1",
    "typer>=0.12",
]

[project.scripts]
integri-audit = "integri_audit_tool.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/integri_audit_tool"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "testcontainers[postgres]>=4.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Docker / a live Postgres instance",
]
addopts = "-m 'not integration'"
